name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # R-CORE: the committed WASM physics kernel must be the build of kernel.c (same clang 18 → same bytes).
      - name: Rebuild the WASM kernel and diff
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang-18 lld-18
          CLANG=clang-18 tools/build-wasm.sh
          git diff --exit-code -- src/sim/wasm

      - run: npm run typecheck

      - run: npm test

      # GitHub runners have no preinstalled Playwright browsers; download the
      # pinned Chromium to the default cache (do NOT set PLAYWRIGHT_BROWSERS_PATH).
      - run: npx playwright install --with-deps chromium

      - run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
